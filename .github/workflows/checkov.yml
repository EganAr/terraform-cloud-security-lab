name: Terraform Security Scan

on:
  push:
    branches:
      - main
    paths:
      - '**.tf'

  pull_request:
    branches:
      - main
    paths:
      - '**.tf'

  workflow_dispatch:

jobs:
  checkov:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform